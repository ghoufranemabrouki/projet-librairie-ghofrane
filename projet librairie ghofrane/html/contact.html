    <script>
     // Fonction pour valider le formulaire principal
    function verif1() {
        // Récupération de la valeur du champ "nom et prénom" et conversion en majuscules
        var nompren = document.getElementById("nompren").value.toUpperCase();
        // Récupération de la valeur du champ "sujet"
        var sujet = document.getElementById("sujet").value;
        // Vérification des boutons radio pour le genre
        var genreF = document.getElementById("genreF").checked;// Vérifie si le genre "F" est sélectionné
        var genreH = document.getElementById("genreH").checked;// Vérifie si le genre "H" est sélectionné
        // Initialisation d'une variable de contrôle pour suivre l'état de validation
        var test = true;
        // Validation du champ "nom et prénom"
    // Le nom doit comporter entre 3 et 7 caractères et contenir uniquement des lettres majuscules
        if (nompren.length < 3 || nompren.length >7 || !/^[A-Z]+$/.test(nompren)) {
            alert('Le nom doit comporter uniquement des lettres et avoir une longueur entre 3 et 20.');
            test = false;// Si la validation échoue, le test est mis à "false"
        }
        // Validation du champ "genre"
    // Au moins un des boutons radio doit être sélectionné
        if (!genreF && !genreH) {
            alert('La sélection du genre est obligatoire.');
            test = false;// Échec de validation
        }
        // Validation du champ "sujet"
    // Un sujet doit être sélectionné dans la liste déroulante
        if (!sujet) {
            alert('La sélection du sujet est obligatoire.');
            test = false;// Échec de validation
        }
        // Retourne le résultat global de la validation
    // Si "test" est vrai, le formulaire peut être soumis
        return test;
    }
    // Fonction pour valider l'adresse e-mail
    function testEmail() {
        // Récupération de la valeur du champ "email"
        var email = document.getElementById("email").value;
        // Validation de l'email
    // L'adresse ne doit pas dépasser 50 caractères
    // Elle doit contenir "@" et "."
    // Le dernier "." doit apparaître après le "@"
        if (email.length > 50 || email.indexOf('@') === -1 || email.indexOf('.') === -1 || email.lastIndexOf('.') < email.indexOf('@')) {
            alert("Veuillez vérifier votre adresse email.");// Message d'erreur si la validation échoue
            return false;// Empêche l'envoi du formulaire
        }
        return true; // Retourne vrai si l'email est valide
    }
    // Fonction pour valider le numéro de téléphone
    function testTelephone() {
      // Récupération de la valeur du champ "téléphone"  
        var telephone = document.getElementById("telephone").value;
        // Validation du téléphone
    // Le numéro doit contenir exactement 8 chiffres et être composé uniquement de chiffres
        if (telephone.length === 8 && !isNaN(telephone)) {
            return true;// Retourne vrai si le numéro est valide
        } else {
            alert("Le numéro doit contenir exactement 8 chiffres.");// Message d'erreur si la validation échoue
            return false;// Empêche l'envoi du formulaire
        }
    }
</script>
